<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Haunter real-editor proof</title><style>body{margin:0;padding:20px;font:14px/1.5 system-ui;background:#f4f4f3;color:#252525}main{max-width:1100px;margin:auto}h1{font-size:22px;margin:0}nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:12px 0}iframe{width:100%;height:740px;border:1px solid #ddd;background:white;border-radius:10px}pre{white-space:pre-wrap;max-height:220px;overflow:auto}textarea{width:100%;padding:10px;box-sizing:border-box}button,select{font:inherit;padding:6px 10px}</style></head>
<body><main><h1>Haunter real editor</h1><p>Local MCP host · actual Next.js editor and collaboration worker · disposable workspace</p><nav><a href="/login">Sign in to the synthetic account</a><a id="web" href="/" target="_blank" rel="noopener">Open the same page in Haunter</a><label for="width">Width</label><select id="width"><option value="full">Full plugin view</option><option value="390">390px panel</option></select><button id="theme" type="button">Switch theme</button></nav><iframe id="app" allow="clipboard-write" src="/editor" title="Haunter MCP editor" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads"></iframe><label for="draft">Conversation draft</label><textarea id="draft" rows="2" placeholder="Ask about your selection…"></textarea><details><summary>Context received by the host</summary><pre id="context">No context attached.</pre></details></main>
<!-- page -->
<script type="module">
const frame=document.getElementById("app");document.getElementById("web").href=window.editorProofWeb;let theme="light";
const send=(message)=>frame.contentWindow.postMessage({jsonrpc:"2.0",...message},location.origin);
async function rpc(method,values={}){const response=await fetch("/mcp",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json","Mcp-Protocol-Version":"2026-07-28","Mcp-Method":method,...(values.name?{"Mcp-Name":values.name}:{})},body:JSON.stringify({jsonrpc:"2.0",id:crypto.randomUUID(),method,params:{...values,_meta:{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientInfo":{name:"Real-editor proof",version:"1.0.0"},"io.modelcontextprotocol/clientCapabilities":{}}}})});const body=await response.json();if(body.error)throw new Error(body.error.message);return body.result;}
window.addEventListener("message",async(event)=>{if(event.source!==frame.contentWindow||event.origin!==location.origin)return;const {method,id,params:values}=event.data;if(id===undefined){if(method==="ui/notifications/initialized")send({method:"ui/notifications/tool-result",params:await rpc("tools/call",{name:"open_haunter_editor",arguments:window.editorProofPage})});return;}try{let result={};if(method==="ui/initialize")result={protocolVersion:"2026-01-26",hostInfo:{name:"Real-editor proof",version:"1.0.0"},hostCapabilities:{serverTools:{},openLinks:{},updateModelContext:{text:{}}},hostContext:{theme,displayMode:"fullscreen",availableDisplayModes:["inline","fullscreen"],containerDimensions:{height:740}}};else if(method==="tools/call")result=await rpc(method,values);else if(method==="ui/update-model-context")document.getElementById("context").textContent=values.content?.map(item=>item.text||"").join("\n\n")||"No context attached.";else if(method==="ui/open-link"){document.getElementById("web").href=values.url;document.getElementById("web").click();}else if(method!=="ping")throw new Error(`Unsupported host method: ${method}`);send({id,result});}catch(error){send({id,error:{code:-32603,message:error.message}});}});
document.getElementById("width").addEventListener("change",(event)=>{frame.style.maxWidth=event.target.value==="full"?"100%":"390px";});
document.getElementById("theme").addEventListener("click",()=>{theme=theme==="light"?"dark":"light";send({method:"ui/notifications/host-context-changed",params:{theme}});});
</script></body></html>
