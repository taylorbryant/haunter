version: 2
updates:
  - package-ecosystem: "bun"
    directories:
      - "/"
      - "/packages/cli"
    schedule:
      interval: "weekly"
    groups:
      beignet:
        patterns: ["@beignet/*"]
      better-auth:
        patterns: ["better-auth", "@better-auth/*", "better-call"]
      blocknote:
        patterns: ["@blocknote/*"]
      hocuspocus:
        patterns: ["@hocuspocus/*"]
      tldraw:
        patterns: ["tldraw", "@tldraw/*"]
      shiki:
        patterns: ["@shikijs/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
    ignore:
      # @openai/mcp-extensions currently requires MCP Apps 1.x.
      - dependency-name: "@modelcontextprotocol/ext-apps"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
