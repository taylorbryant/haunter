name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun ci

      - name: Install CLI dependencies
        working-directory: packages/cli
        run: bun ci

      - name: Install canvas preview browser
        run: bunx --bun playwright install --with-deps chromium --only-shell

      - name: Allow the downloaded Chromium sandbox on Ubuntu
        # Ubuntu 24.04 restricts user namespaces for executables without a profile.
        # Allow only this installed browser, preserving Chromium's own sandbox.
        run: |
          browsers=("$HOME"/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell)
          test "${#browsers[@]}" -eq 1
          test -x "${browsers[0]}"
          sudo tee /etc/apparmor.d/haunter-canvas-chromium > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile haunter-canvas-chromium "${browsers[0]}" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/haunter-canvas-chromium

      - name: Build and verify the production canvas runtime
        env:
          DEBUG: pw:browser
        run: |
          bun --no-env-file scripts/build-canvas-browser.ts
          NODE_ENV=production bun --no-env-file scripts/verify-canvas-renderer.ts

      - name: Install Redis for isolated Lua regression tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-server

      - name: Run full application validation
        run: bun beignet check

      - name: Build and verify packaged Yjs under Bun
        env:
          APP_URL: http://localhost:3000
          NEXT_PUBLIC_COLLABORATION_URL: ws://localhost:1234
          BETTER_AUTH_SECRET: ci-build-placeholder-not-a-production-secret
          SQLITE_DB_URL: file:ci-build.db
          RESEND_API_KEY: re_ci_placeholder
          RESEND_FROM: Haunter <onboarding@resend.dev>
        run: |
          bun beignet db migrate
          bun run build
          bun run check:yjs-bundle

  cli:
    name: CLI (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install CLI dependencies
        run: bun ci
      - name: Validate CLI
        run: bun run check
      - name: Verify the npm package under Node
        run: bun run verify:package
      - name: Install app dependencies for released CLI compatibility
        working-directory: .
        run: bun ci
      - name: Verify published CLI compatibility with the current server
        working-directory: .
        run: bun run verify:cli-compatibility
