name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun ci

      - name: Run tests
        run: bun run test

      - name: Build and verify packaged Yjs under Bun
        env:
          APP_URL: http://localhost:3000
          NEXT_PUBLIC_COLLABORATION_URL: ws://localhost:1234
          BETTER_AUTH_SECRET: ci-build-placeholder-not-a-production-secret
          SQLITE_DB_URL: file:ci-build.db
          RESEND_API_KEY: re_ci_placeholder
          RESEND_FROM: Haunter <onboarding@resend.dev>
        run: |
          bun beignet db migrate
          bun run build
          bun run check:yjs-bundle
