name: Overdue task notifications

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconcile overdue notifications
        env:
          HAUNTER_APP_URL: ${{ vars.APP_URL || 'https://www.haunter.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response_file="${RUNNER_TEMP}/overdue-notifications-response.json"
          http_status="$(curl --silent --show-error \
            --retry 2 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --output "${response_file}" \
            --write-out "%{http_code}" \
            "${HAUNTER_APP_URL%/}/api/cron/tasks/check-overdue")"
          cat "${response_file}"
          case "${http_status}" in
            2??) ;;
            *)
              echo "Unexpected HTTP status: ${http_status}" >&2
              exit 1
              ;;
          esac
